name: Apply optimized PR 9 integration
on:
  push:
    branches: [integrate/pr9-vehicles-never-protected]
    paths: [.github/workflows/apply-pr9-optimized.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply PR 9 and optimize vehicle classification
        run: python .github/scripts/apply_pr9.py
