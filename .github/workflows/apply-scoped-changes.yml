name: Apply scoped source changes
on:
  push:
    branches: [fix/2.0.8-release-fixes]
    paths: [.github/workflows/apply-scoped-changes.yml]
permissions:
  contents: write
concurrency:
  group: protectivewards-release-fixes-write
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'shudnal/ProtectiveWards' && github.ref == 'refs/heads/fix/2.0.8-release-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact source patch and commit without force
        shell: python
        run: |
          import base64, hashlib, subprocess, zlib
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, **kwargs)
          parent = git('rev-parse', 'HEAD^', capture_output=True, text=True).stdout.strip()
          assert parent == '095040eb262c0a3344827d785daa2918b835df36', 'Unexpected branch baseline'
          encoded = ''''''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd637cfc48dddac70a1ec085930b8d83864cd4d82f16e853a6661631111c02841', 'Patch checksum mismatch'
          git('apply', '--check', '-', input=patch)
          git('apply', '--index', '-', input=patch)
          git('diff', '--cached', '--check')
          git('diff', '--cached', '--stat')
          git('config', 'user.name', 'shudnal')
          git('config', 'user.email', '20457922+shudnal@users.noreply.github.com')
          git('commit', '-m', 'Fix ward access controls, clamp range and simplify packaging')
          git('push', 'origin', 'HEAD:refs/heads/fix/2.0.8-release-fixes')
