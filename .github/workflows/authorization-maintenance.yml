name: Authorization source maintenance
on:
  push:
    branches: [work/authorization-maintenance-runner]
    paths: [.maintenance/apply.py]
permissions:
  contents: write
concurrency:
  group: protectivewards-authorization-source-maintenance
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: runner
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/authorization-review-and-server-issues
          path: project
          fetch-depth: 0
      - name: Apply and commit source changes
        working-directory: project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ../runner/.maintenance/apply.py
